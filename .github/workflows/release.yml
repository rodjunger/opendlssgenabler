# Publishes a release for every commit that lands on main.
#
# Only a push to main can start this, which needs write access to the
# repository, so a pull request cannot reach the job that holds the writable
# token. The build itself is the same reusable workflow the pull request uses,
# and runs with `contents: read`.
#
# Releases are named <version>-<short sha>, where the version is the one in
# CMakeLists.txt, so a download says which build it is and which commit it came
# from. When releases move to version changes only, the tag becomes the version
# alone and nothing else here has to change.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: build and test
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-22.04
    # The only job with a writable token, and it runs no code from the tree.
    permissions:
      contents: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: package
          path: package

      - name: Name the release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # The version crosses a job boundary as data. Checking its shape here
          # means nothing unexpected reaches a tag, a file name or a command.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '${VERSION}' is not major.minor.patch" >&2
            exit 1
          fi
          if ! command -v zip >/dev/null; then
            sudo apt-get update && sudo apt-get install -y zip
          fi
          short="${GITHUB_SHA::7}"
          tag="${VERSION}-${short}"
          name="opendlssg-fg-${tag}"
          (cd package && zip -r "../${name}.zip" .)
          {
            echo "ZIP=${name}.zip"
            echo "TAG=${tag}"
            echo "SHORT_SHA=${short}"
          } >> "$GITHUB_ENV"

      - name: Write the notes
        run: |
          set -euo pipefail
          docs="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}"
          cat > notes.md <<EOF
          Enables NVIDIA DLSS Frame Generation on GeForce RTX 30 in games that
          already ship it. The frames are generated by the game's own NVIDIA
          runtime; this removes the restrictions that stop that runtime running
          on an older card. It contains no frame-generation code and nothing of
          NVIDIA's.

          ## Install

          1. Close the game.
          2. Copy \`version.dll\` and \`opendlssg.ini\` next to the game's
             executable. In an Unreal Engine game that is
             \`<Game>\\Binaries\\Win64\`, beside the shipping executable, not the
             launcher in the install folder.
          3. Start the game and enable DLSS Frame Generation in its graphics
             settings.

          If no \`opendlssg\\logs\` folder appears next to the executable, the
          game does not load \`version.dll\`. Remove it and try \`winmm.dll\`,
          then \`dinput8.dll\`, then \`dxgi.dll\`, one at a time. To uninstall,
          delete the DLL and \`opendlssg.ini\`.

          Ship \`opendlssg.ini\` as it comes. Its defaults are the ones to run,
          and [CONFIGURATION.md](${docs}/docs/CONFIGURATION.md) covers the few
          cases that need an edit.

          ## Requirements

          - A GeForce RTX 30. RTX 40 and 50 are detected and left untouched, and
            RTX 20 is not supported yet.
          - A game that already has DLSS Frame Generation. This cannot add the
            feature to a game that does not ship it.
          - Hardware-accelerated GPU scheduling on, in Windows Settings under
            System, Display, Graphics. Streamline refuses frame generation
            without it.

          ## What is in the archive

          | Path | What it is |
          |---|---|
          | \`version.dll\`, \`winmm.dll\`, \`dinput8.dll\`, \`dxgi.dll\` | The proxy under four names. Install one. |
          | \`opendlssg.ini\` | Settings, documented in the file and in CONFIGURATION.md. |
          | \`tools/\` | Offline probes that check an NVIDIA build without launching a game. |
          | \`docs/\` | The documentation below, to read offline. |

          ## Documentation

          - [Configuration](${docs}/docs/CONFIGURATION.md), every setting and
            when to change it
          - [Testing a game](${docs}/docs/TESTING.md), what a healthy run looks
            like, how to read the log, and which games are verified
          - [How it works](${docs}/docs/ARCHITECTURE.md), every change the
            engine makes and where
          - [Building](${docs}/docs/BUILD.md)

          Reporting a problem: set \`Level=3\` under \`[Logging]\` and
          \`StreamlineDiagnostics=1\` under \`[Debug]\`, reproduce it, and attach
          the files from \`opendlssg\\logs\`. Read them first; TESTING.md says
          what they contain.

          Built from [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on main. GPLv3.
          EOF

      - name: Create the release
        env:
          # Scoped to this step. Every value it uses is either produced here or
          # checked above, so nothing from the tree is pasted into a command.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-running the workflow on a commit that already has a release
          # replaces its contents rather than failing on the existing tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file notes.md \
              --prerelease=false \
              --latest
            gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file notes.md \
              --latest
          fi
