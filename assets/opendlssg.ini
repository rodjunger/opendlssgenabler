; opendlssg-fg configuration.
;
; Place this file beside the proxy DLL, next to the game's executable. It is read
; once at startup, so restart the game after editing. The defaults are what you
; should run; everything else exists to isolate a problem.
;
; A value that cannot be read falls back to its default and is reported in the
; log as config_value_rejected. Text after ; or # that follows a space is a
; comment.

[General]
; 1 enables the engine (default). 0 only forwards the system DLL, leaving the
; game exactly as it would be without this file.
Enabled=1

[FrameGeneration]
; 1 lets NVIDIA's runtime generate more than one frame, so games that support
; multi-frame generation offer 3x and 4x (default). The runtime otherwise
; reserves that for RTX 50. 0 keeps every game at 2x.
MultiFrame=1

; 0 follows the multiplier the game asks for (default). 2 to 6 forces it, within
; what the runtime allows. Use it in a game whose menu only switches frame
; generation on and off, so it never asks for more than one generated frame. A
; count the runtime refuses is reported and the game's own request is kept.
ForceMultiplier=0

[Compatibility]
; 1 reports an Ada architecture to the components that gate frame generation
; (default). 0 keeps the real architecture but leaves the hooks installed, to
; check that the engine loads without opening the gate.
SpoofArchToGame=1

; Modules told the GPU is Ada, comma separated. Three need it, for three checks:
;   sl.common.dll    computes the adapter mask that decides whether the
;                    frame-generation plugin loads at all
;   _nvngx.dll       answers the availability query the plugin makes at startup
;   nvngx_dlssg.dll  the frame-generation runtime, which needs it to reach its
;                    kernels
; Everything not listed, including the game and the upscaling runtimes, sees the
; real hardware.
;
; Keep this list short. Telling every caller removed the device before the main
; menu in testing, most likely through the upscaling runtimes choosing Ada-only
; code paths. `none` tells every caller, which is a diagnostic, not a setting.
SpoofCallers=sl.common.dll,_nvngx.dll,nvngx_dlssg.dll

; Forces the frame-generation plugin onto its software frame pacing (default 1).
; Ampere has no hardware flip metering, and without this the generated frames are
; never shown in a Direct3D 12 game.
PatchFlipMetering=1

; The value that means "off" for the plugin's metering flag. -1 reads it from the
; plugin's own code (default), which is correct for every build checked so far.
; 0 or 1 forces it, if a future build is read wrongly.
FlipMeteringValue=-1

; Lifts the Streamline plugin's own clamp on the generated-frame count (default
; 0). The plugin a game ships already allows what that game supports, so this
; only matters for testing beyond it.
PatchFrameClamp=0

; Answers NvAPI_D3D12_SetRawScgPriority with success instead of running it
; (default 1). It is an Ada-only call that removes the device on older hardware.
StubScgPriority=1

[Kernels]
; Supplies kernels the GPU can run (default 1): NVIDIA's own Ampere build where
; the runtime carries one, otherwise its PTX retargeted to this GPU. Without this,
; frame generation is offered and then has nothing to execute.
Retarget=1

; The GPU architecture to target, as an SM number such as 86. 0 asks the CUDA
; driver (default).
TargetSM=0

; Covers Vulkan games (default 1), which hand their kernels to the driver through
; VK_NVX_binary_import rather than NVAPI.
VulkanHooks=1

[Runtime]
; Experimental. Off uses the game's own frame-generation runtime (default).
; Bundled loads RuntimeFile, beside this file, in its place.
Mode=Off
RuntimeFile=opendlssg_nvngx_dlssg.dll

[Logging]
; 0 off, 1 problems (default), 2 decisions and configuration, 3 everything.
; Level 1 keeps errors and warnings, which is what a bug report needs. Use 3
; only to investigate one: level 3 records every call a game makes.
Level=1
; Relative to this file, or absolute. The newest ten log files are kept.
Directory=opendlssg\logs

[Debug]
; Writes Streamline's own log as sl.log beside ours (default 0). Streamline states
; there, and nowhere else, why it accepts or refuses frame generation.
StreamlineDiagnostics=0

; Writes the first few kernel images the runtime creates, before and after
; substitution, under the log directory (default 0).
DumpKernels=0
